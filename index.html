<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk - NetFlix Edition</title>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e50914;
            letter-spacing: 1px;
        }
        .hero {
            height: 70vh;
            background: linear-gradient(to top, #141414, transparent), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
        }
        .hero h1 {
            font-size: 48px;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hero p {
            font-size: 16px;
            max-width: 600px;
            color: #b3b3b3;
            margin-bottom: 20px;
        }
        .hero-btn {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: fit-content;
            transition: background 0.2s;
        }
        .hero-btn:hover {
            background-color: #b20710;
        }
        .section-title {
            padding: 20px 40px 10px 40px;
            font-size: 22px;
            font-weight: bold;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 0 40px 40px 40px;
        }
        .movie-card {
            background: #1f1f1f;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .movie-poster {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }
        .movie-info {
            padding: 12px;
        }
        .movie-title {
            font-size: 15px;
            font-weight: bold;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-year {
            font-size: 13px;
            color: #808080;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header>
        <div class="logo">M.HAWK</div>
        <div style="color: #fff; font-weight: 500;">الملف الشخصي</div>
    </header>

    <!-- واجهة البطل الرئيسية -->
    <div class="hero">
        <h1>The Odyssey</h1>
        <p>رحلة ملحمية طويلة ومحفوفة بالمخاطر للأسطورة أوديسيوس للعودة إلى وطنه بعد حرب طروادة، ومواجهة آلهة ومخلوقات أسطورية.</p>
        <button class="hero-btn" onclick="alert('انتقل لصفحة الفيلم')">مشاهدة الآن</button>
    </div>

    <!-- قسم الأفلام الرائجة -->
    <div class="section-title">الأفلام الرائجة</div>
    <div class="movies-grid">
        <!-- فيلم 1 -->
        <div class="movie-card" onclick="location.href='#'">
            <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=500&q=80" alt="The Odyssey" class="movie-poster">
            <div class="movie-info">
                <div class="movie-title">The Odyssey</div>
                <div class="movie-year">2026 • ⭐ 8.0</div>
            </div>
        </div>
        <!-- فيلم 2 -->
        <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=80" alt="Sci-Fi Movie" class="movie-poster">
            <div class="movie-info">
                <div class="movie-title">Cyber City</div>
                <div class="movie-year">2025 • ⭐ 7.6</div>
            </div>
        </div>
        <!-- فيلم 3 -->
        <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=500&q=80" alt="Action Movie" class="movie-poster">
            <div class="movie-info">
                <div class="movie-title">Dark Horizon</div>
                <div class="movie-year">2026 • ⭐ 8.2</div>
            </div>
        </div>
        <!-- فيلم 4 -->
        <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=500&q=80" alt="Drama Movie" class="movie-poster">
            <div class="movie-info">
                <div class="movie-title">The Last Run</div>
                <div class="movie-year">2024 • ⭐ 7.9</div>
            </div>
        </div>
    </div>

</body>
</html>
