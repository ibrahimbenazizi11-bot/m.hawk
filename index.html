<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk - Stream</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .player-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .servers-menu {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
        }
        .server-btn {
            background-color: #334155;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .server-btn:hover, .server-btn.active {
            background-color: #f59e0b;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>M.hawk Stream</h1>

        <div class="player-container">
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>

        <div class="servers-menu">
            <button class="server-btn active" onclick="changeServer('https://vidsrc.xyz/embed/movie/tt10872600', this)">سيرفر 1</button>
            <button class="server-btn" onclick="changeServer('https://vidsrc.cc/v2/embed/movie/tt10872600', this)">سيرفر 2</button>
        </div>
    </div>

    <script>
        function changeServer(url, buttonElement) {
            document.getElementById('videoPlayer').src = url;
            const buttons = document.querySelectorAll('.server-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
        }

        window.onload = function() {
            document.getElementById('videoPlayer').src = 'https://vidsrc.xyz/embed/movie/tt10872600';
        };
    </script>

</body>
</html>
