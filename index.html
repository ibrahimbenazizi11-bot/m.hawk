<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk - Language Selector</title>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .language-container {
            background: #1f1f1f;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }
        .language-container h3 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #e5e5e5;
        }
        /* تنسيق شريط اختيار اللغات */
        .language-select {
            width: 100%;
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .language-select:hover, .language-select:focus {
            border-color: #e50914;
        }
    </style>
</head>
<body>

    <div class="language-container">
        <h3>اختر لغة العرض</h3>
        <select class="language-select" id="languageSelect" onchange="changeLanguage()">
            <option value="ar">العربية (Arabic)</option>
            <option value="en">English (الإنجليزية)</option>
            <option value="fr">Français (الفرنسية)</option>
            <option value="es">Español (الإسبانية)</option>
            <option value="de">Deutsch (الألمانية)</option>
            <option value="it">Italiano (الإيطالية)</option>
            <option value="tr">Türkçe (التركية)</option>
            <option value="ja">日本語 (اليابانية)</option>
            <option value="ko">한국어 (الكورية)</option>
            <option value="ru">Русский (الروسية)</option>
            <option value="zh">中文 (الصينية)</option>
            <option value="pt">Português (البرتغالية)</option>
            <option value="hi">हिन्दी (الهندية)</option>
            <option value="nl">Nederlands (الهولندية)</option>
        </select>
    </div>

    <script>
        function changeLanguage() {
            var selectedLang = document.getElementById("languageSelect").value;
            // ضبط اتجاه الصفحة تلقائياً (من اليمين ليسار للعربية، والعكس باقي اللغات)
            if (selectedLang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
                document.documentElement.setAttribute('lang', 'ar');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
                document.documentElement.setAttribute('lang', selectedLang);
            }
            // يمكنك إضافة كود حفظ اللغة المختار في LocalStorage هنا مستقبلاً
            console. تم تغيير اللغة إلى: {selectedLang};
        }
    </script>

</body>
</html>
