<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk VIP - Stream Edition</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --accent-red: #E50914;
            --accent-red-hover: #b20710;
            --vip-gold: #f59e0b;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 28px; font-weight: bold; color: var(--accent-red); letter-spacing: 2px; cursor: pointer; }
        .search-box input { background-color: rgba(0, 0, 0, 0.75); border: 1px solid #333; color: #fff; padding: 8px 15px; border-radius: 4px; width: 280px; outline: none; transition: 0.3s; }
        .search-box input:focus { width: 350px; border-color: var(--accent-red); }
        .hero { height: 70vh; background-size: cover; background-position: center; display: flex; align-items: center; padding: 0 50px; position: relative; margin-bottom: 40px; }
        .hero::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 100px; background: linear-gradient(to top, var(--bg-color), transparent); }
        .hero-content { max-width: 600px; z-index: 10; }
        .hero-title { font-size: 48px; font-weight: bold; margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .hero-desc { font-size: 16px; color: var(--text-muted); margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-btns button { background-color: var(--accent-red); color: white; border: none; padding: 10px 25px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .hero-btns button:hover { background-color: var(--accent-red-hover); }
        .main-container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; background: var(--card-bg); padding: 15px 25px; border-radius: 8px; }
        .categories { display: flex; gap: 10px; flex-wrap: wrap; }
        .cat-btn { background: #2f2f2f; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .cat-btn.active, .cat-btn:hover { background: var(--accent-red); }
        .language-select { background-color: #2f2f2f; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 4px; cursor: pointer; outline: none; }
        .section-title { font-size: 22px; font-weight: bold; margin-bottom: 15px; color: #fff; }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .media-card { background: var(--card-bg); border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; position: relative; }
        .media-card:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 10; }
        .media-card img { width: 100%; height: 260px; object-fit: cover; }
        .media-info { padding: 10px; }
        .media-info h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .media-info p { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal-content { background: #181818; width: 100%; max-width: 900px; border-radius: 10px; overflow: hidden; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.9); }
        .modal-player-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .modal-player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.7); color: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 10; }
        .close-modal:hover { background: var(--accent-red); }
        .modal-body { padding: 20px; }
        .modal-title { font-size: 24px; margin-bottom: 8px; }
        .modal-meta { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; display: flex; gap: 15px; }
        .modal-desc { font-size: 14px; color: #ccc; max-height: 80px; overflow-y: auto; line-height: 1.5; }
        .modal-actions { margin-top: 15px; display: flex; gap: 10px; }
        .btn-mylist { background: #333; color: white; border: 1px solid #555; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .btn-mylist:hover { background: #444; }

        .pricing-section { display: flex; justify-content: center; margin: 50px 0; }
        .pricing-card { background: linear-gradient(135deg, #222 0%, #111 100%); border: 2px solid var(--vip-gold); border-radius: 12px; padding: 30px; width: 100%; max-width: 450px; text-align: center; }
        .pricing-card h3 { color: var(--vip-gold); font-size: 24px; margin-bottom: 10px; }
        .price { font-size: 38px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .btn-vip { display: block; background-color: var(--vip-gold); color: #000; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; text-decoration: none; margin-top: 20px; transition: 0.3s; }
        .btn-vip:hover { background-color: #d97706; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchCategory('2026', document.querySelector('.cat-btn'))">M.HAWK VIP</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search any movie or series..." onkeyup="handleSearch(event)">
        </div>
    </header>

    <div class="hero" id="heroBanner">
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">Loading...</h1>
            <p class="hero-desc" id="heroDesc">Please wait while we load featured content.</p>
            <div class="hero-btns">
                <button id="heroPlayBtn">▶ Play Movie</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="controls-bar">
            <div class="categories">
                <button class="cat-btn active" onclick="switchCategory('2026', this)">✨ 2026 Releases</button>
                <button class="cat-btn" onclick="switchCategory('movie', this)">🔥 Top Movies</button>
                <button class="cat-btn" onclick="switchCategory('tv', this)">⭐ Top Series</button>
                <button class="cat-btn" onclick="switchCategory('anime', this)">⛩️ Top Anime</button>
                <button class="cat-btn" onclick="switchCategory('mylist', this)">📋 My List</button>
            </div>
            <select class="language-select" id="languageSelector" onchange="changeLanguage(this.value)">
                <option value="en" selected>🇬🇧 English</option>
                <option value="ar">🇸🇦 Arabic</option>
                <option value="fr">🇫🇷 French</option>
                <option value="de">🇩🇪 German</option>
                <option value="es">🇪🇸 Spanish</option>
                <option value="id">🇮🇩 Indonesian</option>
                <option value="hi">🇮🇳 Hindi</option>
                <option value="ja">🇯🇵 Japanese</option>
                <option value="ko">🇰🇷 Korean</option>
                <option value="tr">🇹🇷 Turkish</option>
            </select>
        </div>

        <div class="content-section">
            <div class="section-title" id="sectionTitle">New Releases (2026)</div>
            <div class="media-grid" id="mediaGrid"></div>
        </div>

        <div class="pricing-section">
            <div class="pricing-card">
                <h3>VIP 4K Subscription</h3>
                <div class="price">$3 <span>/ month</span></div>
                <p style="color: var(--text-muted); font-size: 13px;">Unlock unlimited 4K streaming and multi-language subtitles.</p>
                <a href="https://www.paypal.com/ncp/payment/6VTSA8XPY887S" target="_blank" class="btn-vip">Upgrade VIP 4K</a>
            </div>
        </div>
    </div>

    <div class="modal" id="mediaModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <div class="modal-player-container">
                <iframe id="videoIframe" src="" allowfullscreen></iframe>
            </div>
            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle">Title</h2>
                <div class="modal-meta">
                    <span id="modalYear">Year</span>
                    <span id="modalRating" style="color: #f59e0b;">★ Vote</span>
                </div>
                <p class="modal-desc" id="modalDesc">Description goes here...</p>
                <div class="modal-actions">
                    <button class="btn-mylist" id="modalMyListBtn" onclick="toggleMyListCurrent()">+ Add to My List</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '65fb47dac159884604660e91b9fbe2d3';
        let currentCategory = '2026';
        let currentLang = 'en';
        let activeModalItem = null;

        async function fetchMedia() {
            const grid = document.getElementById('mediaGrid');
            const titleEl = document.getElementById('sectionTitle');
            grid.innerHTML = '<p style="color:#b3b3b3; grid-column: 1/-1; text-align:center;">Loading...</p>';

            if (currentCategory === 'mylist') {
                titleEl.innerText = 'My List';
                renderMyList();
                return;
            }

            let url = '';
            if (currentCategory === '2026') {
                titleEl.innerText = 'New Releases (2026)';
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&primary_release_year=2026&sort_by=popularity.desc&language=${currentLang}`;
            } else if (currentCategory === 'movie') {
                titleEl.innerText = 'Top Rated Global Movies';
                url = `https://api.themoviedb.org/3/movie/top_rated?api_key=${API_KEY}&language=${currentLang}&page=1`;
            } else if (currentCategory === 'tv') {
                titleEl.innerText = 'Top Rated Global Series';
                url = `https://api.themoviedb.org/3/tv/top_rated?api_key=${API_KEY}&language=${currentLang}&page=1`;
            } else if (currentCategory === 'anime') {
                titleEl.innerText = 'Top Rated Anime Masterpieces';
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&sort_by=vote_average.desc&vote_count.gte=500&language=${currentLang}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    renderGrid(data.results);
                    setHero(data.results[0]);
                } else {
                    grid.innerHTML = '<p style="color:#b3b3b3; grid-column: 1/-1; text-align:center;">No results found.</p>';
                }
            } catch (error) {
                console.error(error);
                grid.innerHTML = '<p style="color:#E50914; grid-column: 1/-1; text-align:center;">Failed to load data.</p>';
            }
        }

        async function handleSearch(event) {
            const query = event.target.value.trim();
            if (event.key === 'Enter' && query.length > 0) {
                const grid = document.getElementById('mediaGrid');
                const titleEl = document.getElementById('sectionTitle');
                titleEl.innerText = `Search Results for: "${query}"`;
                grid.innerHTML = '<p style="color:#b3b3b3; grid-column: 1/-1; text-align:center;">Searching...</p>';

                try {
                    const response = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=${currentLang}`);
                    const data = await response.json();
                    if (data.results && data.results.length > 0) {
                        const filtered = data.results.filter(item => item.media_type === 'movie' || item.media_type === 'tv');
                        renderGrid(filtered);
                    } else {
                        grid.innerHTML = '<p style="color:#b3b3b3; grid-column: 1/-1; text-align:center;">No movies or series found.</p>';
                    }
                } catch (e) { console.error(e); }
            } else if (query === '') {
                fetchMedia();
            }
        }

        function renderGrid(items) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';
            items.forEach(item => {
                const title = item.title || item.name || 'Untitled';
                const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/200x280?text=No+Image';
                const vote = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const date = (item.release_date || item.first_air_date || '').substring(0, 4);

                const card = document.createElement('div');
                card.className = 'media-card';
                card.onclick = () => openModal(item);
                card.innerHTML = `
                    <img src="${poster}" alt="${title}">
                    <div class="media-info">
                        <h4>${title}</h4>
                        <p><span>${date}</span> <span style="color: #f59e0b;">★ ${vote}</span></p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setHero(item) {
            const backdrop = item.backdrop_path ? `https://image.tmdb.org/t/p/original${item.backdrop_path}` : '';
            document.getElementById('heroBanner').style.backgroundImage = `linear-gradient(to right, rgba(20,20,20,0.9), rgba(20,20,20,0.3)), url(${backdrop})`;
            document.getElementById('heroTitle').innerText = item.title || item.name || 'Featured Movie';
            document.getElementById('heroDesc').innerText = item.overview || 'No description available.';
            document.getElementById('heroPlayBtn').onclick = () => openModal(item);
        }

        function openModal(item) {
            activeModalItem = item;
            const modal = document.getElementById('mediaModal');
            document.getElementById('modalTitle').innerText = item.title || item.name;
            document.getElementById('modalDesc').innerText = item.overview || 'No description available.';
            document.getElementById('modalYear').innerText = (item.release_date || item.first_air_date || '').substring(0, 4);
            document.getElementById('modalRating').innerText = '★ ' + (item.vote_average ? item.vote_average.toFixed(1) : 'N/A');

            const mediaId = item.id;
            const type = (item.media_type === 'tv' || currentCategory === 'tv' || currentCategory === 'anime') ? 'tv' : 'movie';
            
            // استخدام رابط البديل السريع والآمن
            document.getElementById('videoIframe').src = `https://embed.su/embed/${type}/${mediaId}`;

            updateMyListButtonText();
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('videoIframe').src = '';
            document.getElementById('mediaModal').style.display = 'none';
        }

        function getMyList() {
            let list = localStorage.getItem('mhawk_mylist');
            return list ? JSON.parse(list) : [];
        }

        function toggleMyListCurrent() {
            if (!activeModalItem) return;
            let list = getMyList();
            const index = list.findIndex(i => i.id === activeModalItem.id);
            if (index > -1) { list.splice(index, 1); } 
            else { list.push(activeModalItem); }
            localStorage.setItem('mhawk_mylist', JSON.stringify(list));
            updateMyListButtonText();
            if (currentCategory === 'mylist') { renderMyList(); }
        }

        function updateMyListButtonText() {
            const btn = document.getElementById('modalMyListBtn');
            let list = getMyList();
            const exists = list.some(i => i.id === activeModalItem.id);
            btn.innerText = exists ? '✓ In My List' : '+ Add to My List';
        }

        function renderMyList() {
            const grid = document.getElementById('mediaGrid');
            let list = getMyList();
            if (list.length > 0) { renderGrid(list); } 
            else { grid.innerHTML = '<p style="color:#b3b3b3; grid-column: 1/-1; text-align:center;">Your list is empty. Add movies or series to watch later.</p>'; }
        }

        function switchCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            document.getElementById('searchInput').value = '';
            fetchMedia();
        }

        function changeLanguage(langCode) {
            currentLang = langCode;
            fetchMedia();
        }

        fetchMedia();
    </script>
</body>
</html>
